name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Select changed Markdown files
        id: markdown
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$CURRENT_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
          fi

          git diff --name-only --diff-filter=ACMR -z \
            "$base" "$head" -- '*.md' > /tmp/changed-markdown.z

          count="$(python3 - <<'PY'
          from pathlib import Path

          data = Path('/tmp/changed-markdown.z').read_bytes()
          print(sum(1 for item in data.split(b'\0') if item))
          PY
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed Markdown files: $count"
          tr '\0' '\n' < /tmp/changed-markdown.z

      - name: Lint changed Markdown
        if: steps.markdown.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < /tmp/changed-markdown.z
          markdownlint-cli2 "${files[@]}"

      - name: Validate knowledge forest contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/build_knowledge_forest.py ]]; then
            python3 -m py_compile scripts/build_knowledge_forest.py
            python3 scripts/build_knowledge_forest.py --check
          fi

      - name: Check required root files
        run: |
          for f in README.md CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md LICENSE; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done
          echo "All required root files present."

      - name: Check docs structure
        run: |
          [ -d "docs/areas" ] || { echo "Missing: docs/areas/"; exit 1; }
          [ -d "docs/navigation" ] || { echo "Missing: docs/navigation/"; exit 1; }
          echo "docs/ structure validated."

  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          find scripts/ -name "*.sh" | xargs shellcheck --severity=warning || true
