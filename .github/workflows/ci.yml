name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown
        shell: bash
        run: |
          set +e
          markdownlint-cli2 "**/*.md" "#node_modules" > /tmp/markdownlint.log 2>&1
          status=$?
          tail -n 120 /tmp/markdownlint.log
          exit "$status"

      - name: Check required root files
        run: |
          for f in README.md CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md LICENSE; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done
          echo "All required root files present."

      - name: Check docs structure
        run: |
          [ -d "docs/areas" ] || { echo "Missing: docs/areas/"; exit 1; }
          [ -d "docs/navigation" ] || { echo "Missing: docs/navigation/"; exit 1; }
          echo "docs/ structure validated."

  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          find scripts/ -name "*.sh" | xargs shellcheck --severity=warning || true
